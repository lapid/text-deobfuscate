[project]
name = "text-deobfuscate"
version = "0.1.0a1"
description = "Undo text obfuscation (encodings and visual tricks) and report which transforms were applied."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lapid Harel" }]
keywords = ["deobfuscation", "text", "leetspeak", "homoglyph", "phishing", "unicode", "normalization", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lapid/text-deobfuscate"
Repository = "https://github.com/lapid/text-deobfuscate"
Issues = "https://github.com/lapid/text-deobfuscate/issues"
Changelog = "https://github.com/lapid/text-deobfuscate/blob/master/CHANGELOG.md"
Documentation = "https://github.com/lapid/text-deobfuscate/blob/master/docs/architecture.md"

[project.scripts]
text-deobfuscate = "text_deobfuscate.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"
